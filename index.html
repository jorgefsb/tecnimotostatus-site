<html lang="en">
<head>

<title>TecniMoto · Estatus</title>

<style>

@font-face {
  font-family: "Racing Sans One";
  src: url("https://brandkit.tecnimoto.mx/fonts/RacingSansOne-Regular.ttf") format("truetype");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Bebas Neue";
  src: url("https://brandkit.tecnimoto.mx/fonts/BebasNeue-Regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Montserrat";
  src: url("https://brandkit.tecnimoto.mx/fonts/Montserrat-Variable.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {

  --tm-yellow: #FFD100;
  --tm-orange: #FF6B35;
  --tm-charcoal: #2D2D2D;
  --shadow-hard: 4px 4px 0 #2D2D2D;

  --bg: #F5F5F5;
  --surface: #FFFFFF;
  --ink: #2D2D2D;
  --accent: #FFD100;
  --muted: #6B6B6B;
  --line: #E0E0E0;
 /* tm-success */
 /* tm-danger from kit */
  --r: 14px;
  --f-display: "Racing Sans One", "Bebas Neue", system-ui, sans-serif;
  --f-body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1c1c1c;
  --surface: #2D2D2D;
  --ink: #ffffff;
  --muted: #b5b5b5;
  --line: #4d4d4d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 56px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body.locked { background: var(--ink); color: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: -0.02em; }
h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; }
h2 { font-size: clamp(20px, 3vw, 26px); }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.gate {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
  background:
    radial-gradient(ellipse 70% 50% at 10% 90%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%),
    var(--ink);
  color: var(--bg);
}
.gate-in { width: 100%; max-width: 420px; display: grid; gap: 18px; text-align: center; }
.gate .mark {
  width: 56px; height: 56px; margin: 0 auto;
  border-radius: 16px;
  background: var(--accent);
  color: var(--bg);
  display: grid; place-items: center;
  font-family: var(--f-display);
  font-size: 28px; font-weight: 800;
}
.gate .lede { color: color-mix(in srgb, var(--bg) 78%, transparent); font-size: 15px; }
.gate form { display: grid; gap: 12px; text-align: left; }
.gate label { font-size: 13px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.pwbox {
  display: flex; align-items: stretch;
  background: color-mix(in srgb, var(--bg) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--bg) 22%, transparent);
  border-radius: 12px;
}
.pwbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.pwbox.bad { border-color: #f2907a; }
.pwbox input {
  flex: 1; min-width: 0; border: 0; background: transparent;
  color: var(--bg); font: inherit; font-size: 17px; padding: 14px;
  outline: none;
}
.gobtn {
  font: inherit; font-weight: 600; border: 0; border-radius: 12px;
  padding: 14px 18px; background: var(--accent); color: var(--bg); cursor: pointer;
}
.gobtn:disabled { cursor: progress; filter: saturate(0.6); }
.gatemsg { min-height: 1.4em; font-size: 14px; }
.gatemsg.err { color: #f6a491; }
.gate .meta { font-size: 12.5px; color: color-mix(in srgb, var(--bg) 55%, transparent); }

.top {
  padding: 22px 0 28px;
  background: var(--ink);
  color: var(--bg);
}
.top-row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--bg) 22%, transparent); border-radius: 10px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px;
  border: 0; background: transparent; color: color-mix(in srgb, var(--bg) 78%, transparent); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.ibtn {
  font: inherit; font-size: 13px; border: 1px solid color-mix(in srgb, var(--bg) 22%, transparent);
  background: transparent; color: color-mix(in srgb, var(--bg) 78%, transparent);
  border-radius: 10px; padding: 7px 11px; cursor: pointer;
}
.hero { margin-top: 22px; }
.hero .sub { margin-top: 10px; max-width: 62ch; color: color-mix(in srgb, var(--bg) 72%, transparent); }
.fresh { margin: 18px 0 0; font-size: 13px; color: color-mix(in srgb, var(--bg) 55%, transparent); }

main { padding: 36px 0 72px; display: grid; gap: 36px; }
section { display: grid; gap: 14px; }
.sec-head p { color: var(--muted); }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  font-size: 12.5px; color: var(--muted); font-weight: 500;
  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
}
td { padding: 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.key td { font-weight: 700; }
.empty { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; margin-top: 4px; }
.note { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.assumptions { margin: 0; padding-left: 18px; color: var(--muted); }
.langbar { position: absolute; top: 16px; right: 16px; }

.gate .mark {
  width: auto; height: auto; margin: 0 auto 4px;
  border-radius: 0;
  background: transparent;
  color: inherit;
  display: block;
  font-size: inherit; font-weight: inherit;
  box-shadow: none;
}
.gate .mark.mark-logo { padding: 0; }
.gobtn {
  box-shadow: 4px 4px 0 #2D2D2D;
  color: #2D2D2D !important;
  background: #FFD100 !important;
  font-family: "Montserrat", system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.gate h1, .gate .brand-title {
  font-family: "Racing Sans One", "Bebas Neue", system-ui, sans-serif;
  font-style: italic;
  font-weight: 400;
}

</style>
</head>

    <h1 data-i="title">TecniMoto · Estatus</h1>

      <div class="gatemsg" id="err"></div>
    </form>
    <p class="meta" id="lockMeta"></p>
  </div>
</div>

function copyTable() {
  const over = (PAGE.copy || {})[LANG] || {};
  const base = DEFAULT_COPY[LANG] || DEFAULT_COPY.en;
  return Object.assign({}, DEFAULT_COPY.en, base, over);
}
function t(key, vars) {
  let s = copyTable()[key] || (DEFAULT_COPY.en[key] || key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace("{" + k + "}", vars[k]); });
  return s;
}
function label(key) {

  return table[key] || key;

function dx(text) {

  return i18n[text] || text;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function money(v) {
  const n = Math.round(Number(v) || 0);
  const sign = n < 0 ? "−" : "";
  return sign + "$" + Math.abs(n).toLocaleString("en-US");
}
function fmtDate(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return iso || LAST_TXT;
  const [y, m, d] = iso.split("-").map(Number);
  return new Intl.DateTimeFormat(LOCALE[LANG] || "en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(y, m - 1, d)));
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function langsFrom(data) {
  const set = new Set(["en"]);
  Object.keys(PAGE.copy || {}).forEach(k => set.add(k));
  Object.keys((data && data.i18n) || {}).forEach(k => { if (k !== "_note") set.add(k); });
  return [...set];
}

  ).join("")}</div>`;
}

}

function applyLock() {
  document.documentElement.lang = LANG;

async function unlock(pw, remembered) {
  btn.disabled = true;
  say(remembered ? "opening" : "checking");
  try {
    const data = await decrypt(pw);
    try { sessionStorage.setItem(STORE + "Pw", pw); } catch (_) {}
    render(data, true);
  } catch (_) {
    btn.disabled = false;
    if (remembered) { say(null); try { sessionStorage.removeItem(STORE + "Pw"); } catch (_) {} return; }
    pwbox.classList.add("bad");
    say("bad", true);
    pwIn.select();
  }
}
form.addEventListener("submit", e => {

  const pw = pwIn.value.trim();
  if (!pw) { say("empty", true); pwIn.focus(); return; }
  unlock(pw, false);
});
(() => {

  try { saved = sessionStorage.getItem(STORE + "Pw"); } catch (_) {}
  if (saved) unlock(saved, true); else pwIn.focus({ preventScroll: true });
})();

function seriesKeys(scen) {
  const prefer = ["service", "brand", "training", "revenue", "delivery", "mentors", "direct", "fixed", "oneOff", "ebitda", "dep", "interest", "net", "cash"];
  const skip = new Set(["low", "lowMonth"]);
  const keys = Object.keys(scen).filter(k => Array.isArray(scen[k]) && !skip.has(k));
  return prefer.filter(k => keys.includes(k)).concat(keys.filter(k => !prefer.includes(k)));
}
function pnlKeys(pnl) {
  const lines = (pnl && pnl.lines) || {};
  const order = (pnl.income || []).concat(pnl.costs || []).concat(pnl.result ? [pnl.result] : []);
  const keys = Object.keys(lines);
  if (order.length) return order.filter(k => k in lines).concat(keys.filter(k => !order.includes(k)));
  return keys;
}

      <div class="sec-head"><h2>${t("forecast")}</h2><p>${esc(dx((fc.scenarioNotes || {})[SCEN] || ""))}</p></div>
      <div class="panel"><table>
        <thead><tr><th></th>${fcMonths.map(mo => `<th class="r">${esc(mo)}</th>`).join("")}</tr></thead>
        <tbody>${fcRows}</tbody>
      </table></div>
      ${assum.length ? `<ul class="assumptions">${assum.map(a => `<li>${esc(dx(a))}</li>`).join("")}</ul>` : ""}
    </section>` : ""}
    ${pending.length ? `<section id="pending">
      <div class="sec-head"><h2>${t("pending")}</h2></div>
      <div class="panel"><table><tbody>${pending.map(p =>
        `<tr><td>${esc(dx(p.label))}${p.note ? `<span class="note">${esc(dx(p.note))}</span>` : ""}</td><td class="r">${money(p.value)}</td></tr>`
      ).join("")}</tbody></table></div>
    </section>` : ""}
    ${items.length ? `<section id="items">
      <div class="sec-head"><h2>${t("items")}</h2></div>
      <div class="panel"><table><tbody>${items.map(it =>
        `<tr><td><b>${esc(dx(it.title || ""))}</b><span class="note">${esc(dx(it.detail || ""))}</span></td><td>${esc(dx(it.owner || ""))}</td><td>${esc(it.status || "")}</td></tr>`
      ).join("")}</tbody></table></div>
    </section>` : ""}
    ${files.length ? `<section id="docs">
      <div class="sec-head"><h2>${t("docs")}</h2></div>
      <div class="panel"><table><tbody>${files.map(f =>
        `<tr><td>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title || f.name || "file")}</a>` : esc(f.title || f.name || "")}</td></tr>`
      ).join("")}</tbody></table></div>
    </section>` : ""}
  </main>`;
}

function render(d, first) {
  DATA = d;
  document.getElementById("gate").hidden = true;
  document.body.classList.remove("locked");
  const el = document.getElementById("dash");
  el.hidden = false;
  el.innerHTML = view(d);
  if (first) window.scrollTo(0, 0);
  el.querySelectorAll("[data-scen]").forEach(b => b.addEventListener("click", () => { SCEN = b.dataset.scen; render(DATA); }));
  const themeBtn = document.getElementById("themeBtn");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const root = document.documentElement;
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem(STORE + "Theme", next); } catch (_) {}
  });
  const lockBtn = document.getElementById("lockBtn");
  if (lockBtn) lockBtn.addEventListener("click", () => {
    try { sessionStorage.removeItem(STORE + "Pw"); } catch (_) {}
    location.reload();
  });
}
</script>
</body>
</html>
